[project]
name = "ttrpg-gm-engine"
version = "0.1.0"
description = "Self-hostable system-agnostic TTRPG AI gamemaster engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.32",
  "sse-starlette>=2.1.3",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
